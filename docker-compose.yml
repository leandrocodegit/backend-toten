version: '3.3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8081"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prod
      - TZ=America/Sao_Paulo
    container_name: totem
    networks:
      - totem-network

networks:
  totem-network:
    driver: bridge
